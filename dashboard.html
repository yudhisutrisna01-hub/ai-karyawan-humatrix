<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard AI Karyawan — Humatrix Buah</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  .caption-text { white-space: pre-line; }
</style>
</head>
<body class="bg-slate-100 min-h-screen pb-16">

  <div class="bg-gradient-to-r from-emerald-700 to-emerald-600 text-white px-5 py-6 shadow-md sticky top-0 z-10">
    <h1 class="text-xl font-bold">🌱 Dashboard AI Karyawan</h1>
    <p class="text-emerald-100 text-sm mt-1">Humatrix Buah — Ide & Konten Otomatis</p>
  </div>

  <div class="px-5 mt-4 flex flex-wrap gap-2" id="filterBar">
    <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-full text-sm font-medium bg-emerald-600 text-white shadow-sm">Semua</button>
    <button data-filter="draft" class="filter-btn px-3 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200">Draft</button>
    <button data-filter="written" class="filter-btn px-3 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200">Sudah Ditulis</button>
  </div>

  <div class="grid grid-cols-3 gap-3 px-5 mt-4">
    <div class="bg-white rounded-xl shadow-sm p-3 text-center">
      <div class="text-2xl font-bold text-slate-800" id="statTotal">–</div>
      <div class="text-xs text-slate-500 mt-0.5">Total Ide</div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-3 text-center">
      <div class="text-2xl font-bold text-amber-600" id="statDraft">–</div>
      <div class="text-xs text-slate-500 mt-0.5">Draft</div>
    </div>
    <div class="bg-white rounded-xl shadow-sm p-3 text-center">
      <div class="text-2xl font-bold text-emerald-600" id="statWritten">–</div>
      <div class="text-xs text-slate-500 mt-0.5">Siap Posting</div>
    </div>
  </div>

  <div id="loading" class="text-center py-16 text-slate-400">
    <div class="animate-spin h-8 w-8 border-4 border-emerald-500 border-t-transparent rounded-full mx-auto mb-3"></div>
    Memuat data...
  </div>

  <div id="errorBox" class="hidden mx-5 mt-6 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl p-4"></div>

  <div id="cardList" class="px-5 mt-4 space-y-4"></div>

  <div id="emptyState" class="hidden text-center py-16 text-slate-400 px-8">
    <p class="text-4xl mb-3">📭</p>
    <p>Belum ada ide konten. Jalankan Agent #1 dulu.</p>
  </div>

<script>
  const SUPABASE_URL = "https://qykgbeanhtdkbmohyxwj.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5a2diZWFuaHRka2Jtb2h5eHdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NjkwMDEsImV4cCI6MjEwNDI0NTAwMX0.88joRtaoX_nxs3k2M2t1uQm-THkiWcKnShjF4uQyhYw";

  const platformIcon = { instagram: '📷', tiktok: '🎵', facebook: '👥', youtube: '▶️' };
  const platformColor = {
    instagram: 'bg-pink-100 text-pink-700',
    tiktok: 'bg-slate-100 text-slate-700',
    facebook: 'bg-blue-100 text-blue-700',
    youtube: 'bg-red-100 text-red-700',
  };

  let allData = [];
  let currentFilter = 'all';

  async function loadData() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/content_ideas?select=*&order=created_at.desc`, {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        },
      });
      if (!res.ok) throw new Error(`Gagal ambil data (status ${res.status})`);
      allData = await res.json();
      document.getElementById('loading').classList.add('hidden');
      renderStats();
      renderCards();
    } catch (err) {
      document.getElementById('loading').classList.add('hidden');
      const box = document.getElementById('errorBox');
      box.textContent = 'Gagal memuat data: ' + err.message;
      box.classList.remove('hidden');
    }
  }

  function renderStats() {
    document.getElementById('statTotal').textContent = allData.length;
    document.getElementById('statDraft').textContent = allData.filter(d => d.status === 'draft').length;
    document.getElementById('statWritten').textContent = allData.filter(d => d.status === 'written').length;
  }

  function renderCards() {
    const list = document.getElementById('cardList');
    const filtered = currentFilter === 'all' ? allData : allData.filter(d => d.status === currentFilter);

    if (filtered.length === 0) {
      list.innerHTML = '';
      document.getElementById('emptyState').classList.remove('hidden');
      return;
    }
    document.getElementById('emptyState').classList.add('hidden');

    list.innerHTML = filtered.map(item => {
      const pf = (item.platform || 'lainnya').toLowerCase();
      const badgeColor = platformColor[pf] || 'bg-slate-100 text-slate-700';
      const icon = platformIcon[pf] || '📝';
      const statusBadge = item.status === 'written'
        ? '<span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-medium">✓ Siap posting</span>'
        : '<span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-700 text-xs font-medium">Draft</span>';

      const captionBlock = item.caption ? `
        <div class="mt-3 bg-slate-50 rounded-lg p-3 text-sm text-slate-700 caption-text">${escapeHtml(item.caption)}</div>
        ${item.hashtags ? `<div class="mt-2 text-xs text-blue-600">${escapeHtml(item.hashtags)}</div>` : ''}
        <button onclick="copyCaption(${item.id})" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium py-2 rounded-lg transition">
          📋 Copy Caption
        </button>
      ` : `<div class="mt-3 text-sm text-slate-400 italic">Caption belum ditulis — jalankan Agent #2</div>`;

      return `
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100" id="card-${item.id}">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <span class="px-2 py-0.5 rounded-full text-xs font-medium ${badgeColor}">${icon} ${pf}</span>
            ${statusBadge}
          </div>
          <h3 class="font-semibold text-slate-800 mt-2">${escapeHtml(item.idea_title || '')}</h3>
          <p class="text-sm text-slate-500 mt-1">${escapeHtml(item.idea_detail || '')}</p>
          ${captionBlock}
          <div class="text-[11px] text-slate-300 mt-2">${new Date(item.created_at).toLocaleString('id-ID')}</div>
        </div>
      `;
    }).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  window.copyCaption = function(id) {
    const item = allData.find(d => d.id === id);
    if (!item) return;
    const text = (item.caption || '') + (item.hashtags ? '\n\n' + item.hashtags : '');
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector(`#card-${id} button`);
      const original = btn.textContent;
      btn.textContent = '✓ Tersalin!';
      setTimeout(() => { btn.textContent = original; }, 1500);
    });
  };

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('bg-emerald-600', 'text-white', 'shadow-sm');
        b.classList.add('bg-white', 'text-slate-600', 'border', 'border-slate-200');
      });
      btn.classList.remove('bg-white', 'text-slate-600', 'border', 'border-slate-200');
      btn.classList.add('bg-emerald-600', 'text-white', 'shadow-sm');
      renderCards();
    });
  });

  loadData();
</script>
</body>
</html>
