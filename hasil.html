<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hasil Konten — Humatrix Buah</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:'Segoe UI',system-ui,sans-serif}</style>
</head>
<body class="bg-slate-100 min-h-screen pb-16">

  <div class="bg-gradient-to-r from-emerald-700 to-emerald-600 text-white px-5 py-6 shadow-md sticky top-0 z-10">
    <h1 class="text-xl font-bold">🌱 Hasil Konten AI</h1>
    <p class="text-emerald-100 text-sm mt-1">Humatrix Buah — Siap Dibagikan</p>
  </div>

  <div class="px-5 mt-4 flex flex-wrap gap-2" id="filterBar">
    <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-full text-sm font-medium bg-emerald-600 text-white shadow-sm">Semua</button>
    <button data-filter="written" class="filter-btn px-3 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200">Siap Posting</button>
    <button data-filter="draft" class="filter-btn px-3 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200">Draft</button>
  </div>

  <div id="loading" class="text-center py-16 text-slate-400">
    <div class="animate-spin h-8 w-8 border-4 border-emerald-500 border-t-transparent rounded-full mx-auto mb-3"></div>
    Memuat...
  </div>

  <div id="list" class="px-5 mt-4 space-y-3"></div>

<script>
  const SUPABASE_URL = "https://qykgbeanhtdkbmohyxwj.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5a2diZWFuaHRka2Jtb2h5eHdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NjkwMDEsImV4cCI6MjEwNDI0NTAwMX0.88joRtaoX_nxs3k2M2t1uQm-THkiWcKnShjF4uQyhYw";
  const platformIcon = { instagram: '📷', tiktok: '🎵', facebook: '👥', youtube: '▶️' };
  let allData = [], currentFilter = 'all';

  async function loadData() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/content_ideas?select=*&order=created_at.desc`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
    });
    allData = await res.json();
    document.getElementById('loading').classList.add('hidden');
    render();
  }

  function render() {
    const list = document.getElementById('list');
    const filtered = currentFilter === 'all' ? allData : allData.filter(d => d.status === currentFilter);
    list.innerHTML = filtered.map(item => `
      <a href="/api/hasil/${item.id}" class="block bg-white rounded-xl shadow-sm p-4 border border-slate-100 hover:border-emerald-300 transition">
        <div class="flex items-center justify-between">
          <span class="text-xs font-medium text-slate-500">${platformIcon[item.platform] || '📝'} ${item.platform}</span>
          <span class="text-xs text-emerald-600">Baca →</span>
        </div>
        <h3 class="font-semibold text-slate-800 mt-1">${item.idea_title}</h3>
      </a>
    `).join('') || '<p class="text-center text-slate-400 py-10">Belum ada data.</p>';
  }

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.className = 'filter-btn px-3 py-1.5 rounded-full text-sm font-medium bg-white text-slate-600 border border-slate-200');
      btn.className = 'filter-btn px-3 py-1.5 rounded-full text-sm font-medium bg-emerald-600 text-white shadow-sm';
      render();
    });
  });

  loadData();
</script>
</body>
</html>
